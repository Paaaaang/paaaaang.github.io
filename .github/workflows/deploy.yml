name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 연속 푸시 시 진행 중인 배포를 취소하지 않고 큐에 넣는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cloudcraft 아키텍처를 SVG 로 내려받는다. 키는 저장소 Secret 으로만 넘기고
      # 결과 파일만 빌드에 들어간다. 실패해도 배포는 계속한다.
      - name: Export Cloudcraft architecture
        run: node scripts/export-architecture.mjs
        continue-on-error: true
        env:
          CLOUDCRAFT_API_KEY: ${{ secrets.CLOUDCRAFT_API_KEY }}

      - name: Typecheck and build
        run: npm run build
        env:
          # 레포 이름이 <username>.github.io 가 아니면
          # VITE_BASE 를 '/레포이름/' 으로 바꿔야 한다.
          VITE_BASE: /

      # 방금 빌드한 사이트를 인쇄해 PDF 를 새로 만든다(헤더의 PDF 버튼이 받는 파일).
      # dist 에 바로 써서 배포본이 늘 최신 내용과 같게 한다. 러너에 깔린 Google Chrome 을 쓴다.
      # 실패하면 빌드 때 복사된 public/pioh-portfolio.pdf 가 그대로 배포된다.
      - name: Export portfolio PDF
        run: npm run pdf -- --out dist/pioh-portfolio.pdf
        continue-on-error: true
        env:
          # 빌드와 같은 값이어야 preview 가 같은 경로로 연다.
          VITE_BASE: /

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
