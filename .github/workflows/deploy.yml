name: Deploy to GitHub Pages

on:
  push:
    # 현재 이 레포의 기본 브랜치는 claude/awesome-cerf-tklmiu 다.
    # main 을 만들어 기본 브랜치로 바꾸면 아래에서 지워도 된다.
    branches:
      - main
      - claude/awesome-cerf-tklmiu
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 연속 푸시 시 진행 중인 배포를 취소하지 않고 큐에 넣는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run build
        env:
          # 레포 이름이 <username>.github.io 가 아니면
          # VITE_BASE 를 '/레포이름/' 으로 바꿔야 한다.
          VITE_BASE: /

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
