<!doctype html>
<html lang="ko" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />

    <title>오평일 · 서비스 기획자 포트폴리오</title>
    <meta
      name="description"
      content="요청의 표면이 아니라 그 아래의 운영 실태를 먼저 확인합니다. 문제를 정의한 뒤 구조로 만들고, 결과를 숫자로 검증하는 서비스 기획자 오평일의 포트폴리오."
    />
    <link rel="canonical" href="https://paaaaang.github.io/" />

    <!-- 검색 결과에 노출하지 않는다. 채용 담당자에게 직접 전달하는 링크로만 쓴다.
         robots.txt 와 함께 걸어야 이미 수집된 페이지도 색인에서 빠진다.
         규칙을 지키는 크롤러에만 유효하다는 점은 docs/봇-차단.md 에 적어 두었다. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />

    <meta property="og:type" content="profile" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="오평일 · 서비스 기획자 포트폴리오" />
    <meta
      property="og:description"
      content="한 사람에게 묶여 있던 운영을 여럿이 쓸 수 있는 구조로 바꿉니다. 143명 지원 · 50% 단축 · 75분→55분."
    />
    <meta property="og:url" content="https://paaaaang.github.io/" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 프로필 사진을 public/media/profile/ 에 넣고 아래 경로를 맞추면
         링크 공유 시 미리보기에도 얼굴이 먼저 보인다. -->
    <meta property="og:image" content="https://paaaaang.github.io/media/profile/og.jpg" />
    <meta property="og:image:alt" content="서비스 기획자 오평일" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />

    <script>
      document.documentElement.classList.remove('no-js')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; color: #e9e5dd; font-family: sans-serif">
        이 포트폴리오는 스크롤 인터랙션을 사용합니다. JavaScript를 켜면 전체 내용을 볼 수 있습니다.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
